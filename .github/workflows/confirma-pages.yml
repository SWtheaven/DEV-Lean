name: Deploy LucronomIA Confirma

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/confirma/public/**"
      - ".github/workflows/confirma-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "confirma-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/confirma
          cp supabase/functions/confirma/public/index.html _site/confirma/index.html
          cp supabase/functions/confirma/public/styles.css _site/confirma/styles.css
          cp supabase/functions/confirma/public/app.js _site/confirma/app.js
          cp supabase/functions/confirma/public/pdf-professional.js _site/confirma/pdf-professional.js
          sed -i 's|const API = "api";|const API = "https://jxuazdoflabqerkccevi.supabase.co/functions/v1/confirma/api";|' _site/confirma/app.js
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
